name: Cmd *
description: 'Cmd was a Vancouver, Canada-based cybersecurity startup founded in 2016 that built
  runtime security and observability purpose-built for Linux infrastructure, giving security and
  DevOps teams real-time visibility and policy-based control over user activity across cloud
  workloads. Backed by GV (Google Ventures), which led its $15M Series B in 2019, Cmd raised roughly
  $21.6M total before being acquired by Elastic in August 2021, where its technology was folded into
  the Elastic Security cloud workload protection and Limitless XDR offering. Co-founders Jake King
  (CSO) and Santosh Krishan joined Elastic through the acquisition. Cmd no longer operates as an
  independent company and publishes no live API, developer portal, or public API surface; this
  profile is retained as an acquired-company record in the API Evangelist network.'
